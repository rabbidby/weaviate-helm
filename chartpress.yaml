charts:
  - name: weaviate
    repo: # This should be your GitHub repo name and the url where our GitHub Pages site is being published
      git: weaviate/weaviate-helm
      published: https://weaviate.github.io/weaviate-helm/
  - name: weaviate-otel-collector
    repo: # Published into the same GitHub Pages index as the weaviate chart, so
      # `helm repo add weaviate https://weaviate.github.io/weaviate-helm` also
      # exposes `weaviate/weaviate-otel-collector`. Source of record:
      # https://github.com/weaviate/weaviate-otel-collector
      git: weaviate/weaviate-helm
      published: https://weaviate.github.io/weaviate-helm/