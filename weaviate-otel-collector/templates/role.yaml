{{- if .Values.rbac.create -}}
# Namespaced Role (NOT a ClusterRole): the collector only needs to discover
# Weaviate pods in the Weaviate namespace to scrape them. Minimal blast radius.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "woc.fullname" . }}
  namespace: {{ include "woc.weaviateNamespace" . }}
  labels:
    {{- include "woc.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
{{- end }}
